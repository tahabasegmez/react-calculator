server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Resolve the backend through Docker's DNS on each request, so a restarted backend with a
    # new IP address is still reached.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass $backend;
    }

    # Hashed file names change on every build, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
